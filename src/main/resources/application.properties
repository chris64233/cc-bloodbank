spring.application.name=cc-bloodbank
spring.datasource.url=jdbc:h2:file:./data/cc-bloodbank
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# 每次成功预留的有效时长
bloodbank.reservation-ttl=PT24H
# 到期预留清理任务的执行间隔（毫秒）
bloodbank.sweeper.fixed-delay=60000
