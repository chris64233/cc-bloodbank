spring.datasource.url=jdbc:h2:mem:bloodbank-test;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# 测试用较短预留有效期，便于用可变时钟推进到期
bloodbank.reservation-ttl=PT1H
# 测试中关闭后台清理的自动触发，改为手动调用
bloodbank.sweeper.fixed-delay=3600000
